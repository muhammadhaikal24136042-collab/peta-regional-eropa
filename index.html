<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PETA REGIONAL EROPA</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- LEAFLET AJAX CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        #maps { height: 100vh; width: 100%; }

        /* Styling Legenda */
        .info.legend {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 20px;
            color: #333;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .info.legend h4 {
            margin: 0 0 5px;
            color: #2c3e50;
            font-size: 14px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 3px;
        }

        /* Styling Custom Icon Marker */
        .custom-marker-icon {
            background: transparent !important;
            border: none !important;
            display: flex !important;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.4));
        }

        /* Modifikasi Tampilan Kontrol Layer */
        .leaflet-control-layers-overlays label { margin-bottom: 6px; }
    </style>
</head>
<body>

    <div id="maps"></div>

    <script>
        // 1. INISIALISASI BASEMAP (Fokus ke Eropa)
        var map = L.map('maps').setView([50.0, 10.0], 4);

        var OSM = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var SATELIT = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });

        // 2. FUNGSI POPUP
        function popUpBatas(feature, layer) {
            if (feature.properties) {
                var namaNegara = feature.properties.Country || feature.properties.NAME || "Wilayah Eropa";
                layer.bindPopup("<b>Batas Negara:</b><br>" + namaNegara);
            }
        }

        function popUpAOE(feature, layer) {
            if (feature.properties) {
                layer.bindPopup("<b>Batas AOE (Area of Interest)</b>");
            }
        }

        function popUpIbuKota(feature, layer) {
            if (feature.properties) {
                var fotoFile = feature.properties.foto || "default.jpg";
                var content = "<div style='text-align:center; width: 200px;'>" +
                              "<b>" + feature.properties.Capital + "</b><br>" + 
                              feature.properties.Country + "<br>" + 
                              "<small><i>" + feature.properties.Region + "</i></small><br><br>" +
                              "<img src='" + fotoFile + "' style='width:100%; height:120px; object-fit:cover; border-radius:4px; border: 1px solid #ccc;' onerror=\"this.src='https://via.placeholder.com/200x120?text=Foto+Tidak+Ditemukan'\">" +
                              "</div>";
                layer.bindPopup(content);
            }
        }

        function popUpTitikTertinggi(feature, layer) {
            if (feature.properties) {
                var fotoFile = feature.properties.foto || "default.jpg";
                var content = "<div style='text-align:center; width: 200px;'>" +
                              "<b>" + feature.properties.Peak_Name + "</b><br>" + 
                              "Ketinggian: " + feature.properties.Elevation + " mdpl<br>" + 
                              feature.properties.Country + "<br>" + 
                              "<small><i>" + feature.properties.Region + "</i></small><br><br>" +
                              "<img src='" + fotoFile + "' style='width:100%; height:120px; object-fit:cover; border-radius:4px; border: 1px solid #ccc;' onerror=\"this.src='https://via.placeholder.com/200x120?text=Foto+Tidak+Ditemukan'\">" +
                              "</div>";
                layer.bindPopup(content);
            }
        }

        function popUpSungai(feature, layer) {
            if (feature.properties && feature.properties.name) {
                layer.bindPopup("<b>Sungai:</b> " + feature.properties.name);
            }
        }

        // 3. DEKLARASI LAYER & DATA VEKTOR

        // A. Batas Administrasi (AJAX)
        var LayerBatas = new L.GeoJSON.AJAX("batas_administrasi.geojson", {
            onEachFeature: popUpBatas,
            style: {
                color: "#2c3e50",
                weight: 1.5,
                fillColor: "#ecf0f1",
                fillOpacity: 0.3
            }
        }).addTo(map);

        // B. Batas AOI (AJAX)
        var LayerAOE = new L.GeoJSON.AJAX("BATAS AOE.geojson", {
            onEachFeature: popUpAOE,
            style: {
                color: "#e74c3c",       // Warna garis merah mencolok untuk AOI
                weight: 2,
                fillColor: "#e74c3c",
                fillOpacity: 0.1        // Transparan
            }
        }).addTo(map);

        // C. Ibu Kota Negara (Embed)
        var dataIbuKota = {
            "type": "FeatureCollection",
            "name": "IBU KOTA NEGARA",
            "features": [
                { "type": "Feature", "properties": { "Region": "Western Europe", "Country": "United Kingdom", "Capital": "London", "foto": "london.jpg" }, "geometry": { "type": "Point", "coordinates": [ -0.1276, 51.5074 ] } },
                { "type": "Feature", "properties": { "Region": "Western Europe", "Country": "Ireland", "Capital": "Dublin", "foto": "dublin.jpg" }, "geometry": { "type": "Point", "coordinates": [ -6.2603, 53.3498 ] } },
                { "type": "Feature", "properties": { "Region": "Western Europe", "Country": "France", "Capital": "Paris", "foto": "paris.jpg" }, "geometry": { "type": "Point", "coordinates": [ 2.3522, 48.8566 ] } },
                { "type": "Feature", "properties": { "Region": "Western Europe", "Country": "Germany", "Capital": "Berlin", "foto": "berlin.jpg" }, "geometry": { "type": "Point", "coordinates": [ 13.405, 52.52 ] } },
                { "type": "Feature", "properties": { "Region": "Western Europe", "Country": "Netherlands", "Capital": "Amsterdam", "foto": "amsterdam.jpg" }, "geometry": { "type": "Point", "coordinates": [ 4.9041, 52.3676 ] } },
                { "type": "Feature", "properties": { "Region": "Western Europe", "Country": "Belgium", "Capital": "Brussels", "foto": "brussels.jpg" }, "geometry": { "type": "Point", "coordinates": [ 4.3517, 50.8503 ] } },
                { "type": "Feature", "properties": { "Region": "Western Europe", "Country": "Luxembourg", "Capital": "Luxembourg", "foto": "luxembourg.jpg" }, "geometry": { "type": "Point", "coordinates": [ 6.1319, 49.6116 ] } },
                { "type": "Feature", "properties": { "Region": "Western Europe", "Country": "Switzerland", "Capital": "Bern", "foto": "bern.jpg" }, "geometry": { "type": "Point", "coordinates": [ 7.4474, 46.948 ] } },
                { "type": "Feature", "properties": { "Region": "Western Europe", "Country": "Austria", "Capital": "Vienna", "foto": "vienna.jpg" }, "geometry": { "type": "Point", "coordinates": [ 16.3738, 48.2082 ] } },
                { "type": "Feature", "properties": { "Region": "Northern Europe", "Country": "Norway", "Capital": "Oslo", "foto": "oslo.jpg" }, "geometry": { "type": "Point", "coordinates": [ 10.7522, 59.9139 ] } },
                { "type": "Feature", "properties": { "Region": "Northern Europe", "Country": "Sweden", "Capital": "Stockholm", "foto": "stockholm.jpg" }, "geometry": { "type": "Point", "coordinates": [ 18.0686, 59.3293 ] } },
                { "type": "Feature", "properties": { "Region": "Northern Europe", "Country": "Finland", "Capital": "Helsinki", "foto": "helsinki.jpg" }, "geometry": { "type": "Point", "coordinates": [ 24.9384, 60.1699 ] } },
                { "type": "Feature", "properties": { "Region": "Northern Europe", "Country": "Denmark", "Capital": "Copenhagen", "foto": "copenhagen.jpg" }, "geometry": { "type": "Point", "coordinates": [ 12.5683, 55.6761 ] } },
                { "type": "Feature", "properties": { "Region": "Northern Europe", "Country": "Iceland", "Capital": "Reykjavik", "foto": "reykjavik.jpg" }, "geometry": { "type": "Point", "coordinates": [ -21.8277, 64.1265 ] } }
            ]
        };

        var LayerIbuKota = L.geoJSON(dataIbuKota, {
            onEachFeature: popUpIbuKota,
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: L.divIcon({
                        html: '<span style="font-size: 20px;">🏛️</span>',
                        className: 'custom-marker-icon',
                        iconSize: [20, 20],
                        iconAnchor: [10, 10],
                        popupAnchor: [0, -10]
                    })
                });
            }
        }).addTo(map);

        // D. Titik Tertinggi (Embed)
        var dataTitikTertinggi = {
            "type": "FeatureCollection",
            "name": "TITIK TERTINGGI",
            "features": [
                { "type": "Feature", "properties": { "Elevation": 4808, "Peak_Name": "Mont Blanc", "Region": "Western Europe", "Country": "France", "foto": "Mont Blanc.jpg" }, "geometry": { "type": "Point", "coordinates": [ 6.8652, 45.8326 ] } },
                { "type": "Feature", "properties": { "Elevation": 4634, "Peak_Name": "Dufourspitze (Monte Rosa)", "Region": "Western Europe", "Country": "Switzerland", "foto": "Dufourspitze (Monte Rosa).jpg" }, "geometry": { "type": "Point", "coordinates": [ 7.8667, 45.9369 ] } },
                { "type": "Feature", "properties": { "Elevation": 3798, "Peak_Name": "Grossglockner", "Region": "Western Europe", "Country": "Austria", "foto": "Grossglockner.jpg" }, "geometry": { "type": "Point", "coordinates": [ 12.6947, 47.0742 ] } },
                { "type": "Feature", "properties": { "Elevation": 2962, "Peak_Name": "Zugspitze", "Region": "Western Europe", "Country": "Germany", "foto": "zugspitze.jpg" }, "geometry": { "type": "Point", "coordinates": [ 10.9854, 47.4212 ] } },
                { "type": "Feature", "properties": { "Elevation": 694, "Peak_Name": "Signal de Botrange", "Region": "Western Europe", "Country": "Belgium", "foto": "Signal de Botrange.jpg" }, "geometry": { "type": "Point", "coordinates": [ 6.0928, 50.5017 ] } },
                { "type": "Feature", "properties": { "Elevation": 560, "Peak_Name": "Kneiff", "Region": "Western Europe", "Country": "Luxembourg", "foto": "Kneiff.jpg" }, "geometry": { "type": "Point", "coordinates": [ 6.0369, 50.1583 ] } },
                { "type": "Feature", "properties": { "Elevation": 322, "Peak_Name": "Vaalserberg", "Region": "Western Europe", "Country": "Netherlands", "foto": "vaalserberg.jpg" }, "geometry": { "type": "Point", "coordinates": [ 6.0213, 50.7532 ] } },
                { "type": "Feature", "properties": { "Elevation": 2469, "Peak_Name": "Galdhøpiggen", "Region": "Northern Europe", "Country": "Norway", "foto": "Galdhøpiggen.jpg" }, "geometry": { "type": "Point", "coordinates": [ 8.3124, 61.6365 ] } },
                { "type": "Feature", "properties": { "Elevation": 2110, "Peak_Name": "Hvannadalshnúkur", "Region": "Northern Europe", "Country": "Iceland", "foto": "Hvannadalshnúkur.jpg" }, "geometry": { "type": "Point", "coordinates": [ -16.6749, 64.0147 ] } },
                { "type": "Feature", "properties": { "Elevation": 2096, "Peak_Name": "Kebnekaise", "Region": "Northern Europe", "Country": "Sweden", "foto": "Kebnekaise.jpg" }, "geometry": { "type": "Point", "coordinates": [ 18.5161, 67.9006 ] } },
                { "type": "Feature", "properties": { "Elevation": 1345, "Peak_Name": "Ben Nevis", "Region": "Northern Europe", "Country": "United Kingdom", "foto": "Ben Nevis.jpg" }, "geometry": { "type": "Point", "coordinates": [ -5.0036, 56.7969 ] } },
                { "type": "Feature", "properties": { "Elevation": 1324, "Peak_Name": "Halti", "Region": "Northern Europe", "Country": "Finland", "foto": "Halti.jpg" }, "geometry": { "type": "Point", "coordinates": [ 21.265, 69.3081 ] } },
                { "type": "Feature", "properties": { "Elevation": 1038, "Peak_Name": "Carrauntoohil", "Region": "Northern Europe", "Country": "Ireland", "foto": "Carrauntoohil.jpg" }, "geometry": { "type": "Point", "coordinates": [ -9.7427, 51.9995 ] } },
                { "type": "Feature", "properties": { "Elevation": 170, "Peak_Name": "Møllehøj", "Region": "Northern Europe", "Country": "Denmark", "foto": "Møllehøj.jpg" }, "geometry": { "type": "Point", "coordinates": [ 9.8258, 55.9775 ] } }
            ]
        };

        var LayerTitikTertinggi = L.geoJSON(dataTitikTertinggi, {
            onEachFeature: popUpTitikTertinggi,
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: L.divIcon({
                        html: '<span style="font-size: 20px;">⛰️</span>',
                        className: 'custom-marker-icon',
                        iconSize: [20, 20],
                        iconAnchor: [10, 10],
                        popupAnchor: [0, -10]
                    })
                });
            }
        }).addTo(map);

        // E. Sungai (AJAX)
        var LayerSungai = new L.GeoJSON.AJAX("sungai.geojson", {
            onEachFeature: popUpSungai,
            style: { 
                color: "#2980b9", 
                weight: 2, 
                opacity: 0.8 
            }
        }).addTo(map);

        // 4. KONTROL LEGENDA
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            div.innerHTML = "<h4>Legenda Peta Eropa</h4>" +
                            "<span style='display:inline-block; width: 15px; height: 15px; background-color: #ecf0f1; border: 1.5px solid #2c3e50; margin-right: 5px; vertical-align: middle;'></span> Batas Administrasi<br>" +
                            "<span style='display:inline-block; width: 15px; height: 15px; background-color: rgba(231,76,60,0.2); border: 1.5px solid #e74c3c; margin-right: 5px; vertical-align: middle;'></span> Batas AOE<br>" +
                            "<span style='font-size: 16px;'>🏛️</span> Titik Ibu Kota Negara<br>" +
                            "<span style='font-size: 16px;'>⛰️</span> Titik Tertinggi<br>" +
                            "<span style='display:inline-block; width: 15px; height: 3px; background-color: #2980b9; margin-right: 5px; vertical-align: middle;'></span> Aliran Sungai";
            return div;
        };
        legend.addTo(map);

        // 5. STRUKTUR KONTROL MENU LAYER
        var baseMaps = {
            "OpenStreetMap": OSM,
            "Satelit (Google)": SATELIT
        };

        var overlayMaps = {
            "<span style='font-weight: bold; color: #2c3e50;'>-- DATA VEKTOR --</span>": L.layerGroup(),
            "&nbsp;&nbsp;&nbsp;&nbsp; 🗺️ Batas Administrasi": LayerBatas,
            "&nbsp;&nbsp;&nbsp;&nbsp; 🛑 Batas AOE": LayerAoi,
            "&nbsp;&nbsp;&nbsp;&nbsp; 🏛️ Ibu Kota Negara": LayerIbuKota,
            "&nbsp;&nbsp;&nbsp;&nbsp; ⛰️ Titik Tertinggi": LayerTitikTertinggi,
            "&nbsp;&nbsp;&nbsp;&nbsp; 🌊 Aliran Sungai": LayerSungai
        };

        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
        
        // Non-aktifkan klik pada header menu layer
        document.addEventListener('DOMContentLoaded', function() {
            var boldLabels = document.querySelectorAll('.leaflet-control-layers-overlays label:has(span[style*="font-weight: bold"])');
            boldLabels.forEach(function(label) {
                label.style.pointerEvents = 'none';
                var checkbox = label.querySelector('input[type="checkbox"]');
                if(checkbox) checkbox.style.display = 'none';
            });
        });
    </script>
</body>
</html>
